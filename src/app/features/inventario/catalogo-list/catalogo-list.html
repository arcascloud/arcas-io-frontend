<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">{{ config().titulo }}</h1>
      <p class="page-subtitle">{{ config().subtitulo }}</p>
    </div>
    <div>
      <p-button label="Nuevo"
      [rounded]="true"
      [raised]="true"
      variant="text"
      severity="success"
      icon="pi pi-plus" size="small" (onClick)="nuevo()" />
    </div>
  </header>

  <div class="filtros card">
    <div class="campo">
      <label>Buscar</label>
      <input

        pInputText type="text"
        pSize="small"
        placeholder="Buscar..." [ngModel]="busqueda()" (ngModelChange)="busqueda.set($event)"
        (keyup.enter)="buscar()" />
    </div>
    <div class="campo acciones">
      <p-button label="Buscar"
       [rounded]="true"
       icon="pi pi-search" size="small"
        severity="info"
       (onClick)="buscar()" />
      <p-button label="Limpiar"
       [rounded]="true"
        icon="pi pi-times"
        severity="secondary" text size="small"
        (onClick)="limpiarFiltros()" />
    </div>
  </div>

  <p-table
    [value]="filtered()"
    [loading]="cargando()"
    [paginator]="true"
    [rows]="20"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}"
    size="small"
    styleClass="p-datatable-striped">

    <ng-template pTemplate="header">
      <tr>
        @for (col of config().campos; track col.key) {
          <th>{{ col.label }}</th>
        }
        @if (!config().sinEstado) {
          <th style="width: 8rem" class="text-center">Estado</th>
        }
        <th style="width: 4rem" class="text-center"></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-item>
      <tr>
        @for (col of config().campos; track col.key) {
          <td>{{ item[col.key] || '-' }}</td>
        }
        @if (!config().sinEstado) {
          <td class="text-center">
            <p-tag [value]="activoLbl(item.sn_activo)" [severity]="activoSev(item.sn_activo)" />
          </td>
        }
        <td class="text-center">
          <p-button
            icon="pi pi-pencil"
            size="small"
            variant="text"
            [rounded]="true"
            severity="secondary"
            (onClick)="editar(item[config().idKey])" />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="empty">
      <tr>
        <td [attr.colspan]="config().campos.length + (!config().sinEstado ? 2 : 1)" class="text-center p-4">
          No hay registros.
        </td>
      </tr>
    </ng-template>
  </p-table>
</section>

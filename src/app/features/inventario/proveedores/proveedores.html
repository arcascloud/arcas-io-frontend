<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">Proveedores</h1>
      <p class="page-subtitle">Administración de proveedores</p>
    </div>
    <p-button label="Nuevo proveedor" icon="pi pi-plus" rounded size="small" (onClick)="nuevo()" />
  </header>

  <div class="filtros card">
    <div class="campo">
      <label>Buscar</label>
      <input
        pInputText
        type="text"
        placeholder="Nombre, RTN, nro. proveedor..."
        [ngModel]="q()"
        (ngModelChange)="q.set($event)"
        (keyup.enter)="buscar()"
      />
    </div>
    <div class="campo acciones">
      <p-button label="Buscar" icon="pi pi-search" size="small" rounded (onClick)="buscar()" />
      <p-button
        label="Limpiar"
        icon="pi pi-times"
        severity="secondary"
        text
        size="small"
        rounded
        (onClick)="limpiarFiltros()"
      />
    </div>
  </div>

  <p-table
    [value]="filtered()"
    [loading]="cargando()"
    dataKey="proveedorId"
    [paginator]="true"
    [rows]="20"
    size="small"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}"
  >
    <ng-template #header>
      <tr>
        <th>Proveedor</th>
        <th>Nro. proveedor</th>
        <th>Razón social</th>
        <th>RTN</th>
        <th>Límite crédito</th>
        <th>Estado</th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template #body let-p>
      <tr>
        <td>{{ p.nombres }} {{ p.apellidos }}</td>
        <td>{{ p.nroproveedor }}</td>
        <td>{{ p.razonsocial || '-' }}</td>
        <td>{{ p.rtn || '-' }}</td>
        <td>{{ moneda(p.limiteCredito) }}</td>
        <td><p-tag [value]="activoLbl(p.sn_activo)" [severity]="activoSev(p.sn_activo)" /></td>
        <td>
          <p-button
            icon="pi pi-pencil"
            pTooltip="Editar"
            (onClick)="editar(p.proveedorId, $event)"
            severity="warn"
            text
            size="small"
            rounded
          />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="100" class="text-center p-3">No hay proveedores que coincidan con los filtros.</td>
      </tr>
    </ng-template>
  </p-table>
</section>

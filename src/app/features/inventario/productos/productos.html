<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">Productos</h1>
      <p class="page-subtitle">Administración del catálogo de productos</p>
    </div>
    <p-button label="Nuevo producto" icon="pi pi-plus" rounded size="small" (onClick)="nuevo()" />
  </header>

  <div class="filtros card">
    <div class="campo">
      <label>Buscar</label>
      <input
        pInputText
        type="text"
        placeholder="Descripción, código..."
        [ngModel]="q()"
        (ngModelChange)="q.set($event)"
        (keyup.enter)="buscar()"
      />
    </div>
    <div class="campo acciones">
      <p-button label="Buscar" icon="pi pi-search" size="small" rounded (onClick)="buscar()" />
      <p-button
        label="Limpiar"
        icon="pi pi-times"
        severity="secondary"
        text
        size="small"
        rounded
        (onClick)="limpiarFiltros()"
      />
    </div>
  </div>

  <div class="tabla-responsive">
  <p-table
    [value]="filtered()"
    [loading]="cargando()"
    dataKey="produtoId"
    [paginator]="true"
    [rows]="20"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}"
    size="small"
    styleClass="p-datatable-striped">

    <ng-template pTemplate="header">
      <tr>
        <th style="width: 12rem">Cod.</th>
        <th>Descripción</th>
        <th style="width: 7rem" class="text-center">Estado</th>
        <th style="width: 4rem" class="text-center"></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-p>
      <tr (click)="editar(p.produtoId)" style="cursor: pointer">
        <td class="font-bold">{{ p.codbarra || '-' }}</td>
        <td>{{ p.descripcion }}</td>
        <td class="text-center">
          <p-tag [value]="activoLbl(p.sn_activo)" [severity]="activoSev(p.sn_activo)" />
        </td>
        <td class="text-center">
          <p-button
            icon="pi pi-pencil"
            size="small"
            variant="text"
            [rounded]="true"
            severity="secondary"
            (onClick)="$event.stopPropagation(); editar(p.produtoId)" />
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="empty">
      <tr>
        <td colspan="4" class="text-center p-4">No hay productos que coincidan con los filtros.</td>
      </tr>
    </ng-template>
  </p-table>
  </div>
</section>

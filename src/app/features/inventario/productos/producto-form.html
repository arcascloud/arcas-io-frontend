<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">{{ titulo() }}</h1>
      <p class="page-subtitle">Registro de producto</p>
    </div>
    <p-button
      label="Volver"
      icon="pi pi-arrow-left"
      severity="secondary"
      text
      size="small"
      rounded
      (onClick)="volver()"
    />
  </header>

  @if (cargando()) {
    <div class="card">Cargando datos...</div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="guardar()" class="card form-grid">
      <div class="campo">
        <label for="descripcion">Descripción <span class="req">*</span></label>
        <input
          pInputText
          pSize="small"
          id="descripcion"
          formControlName="descripcion"
          maxlength="250"
          placeholder="Descripción del producto"
          [ngClass]="{ 'ng-invalid': invalid('descripcion') }"
        />
        @if (invalid('descripcion')) {
          <small class="err">La descripción es obligatoria</small>
        }
      </div>

      <div class="campo">
        <label for="descripcion_corta">Descripción corta</label>
        <input
          pInputText
          pSize="small"
          id="descripcion_corta"
          formControlName="descripcion_corta"
          maxlength="50"
          placeholder="Nombre corto"
        />
      </div>

      <div class="campo">
        <label for="codbarra">Código de barras</label>
        <input
          pInputText
          pSize="small"
          id="codbarra"
          formControlName="codbarra"
          maxlength="20"
          placeholder="Código de barras"
        />
      </div>

      <div class="campo">
        <label for="categoriaId">Categoría <span class="req">*</span></label>
        <p-select
          size="small"
          id="categoriaId"
          formControlName="categoriaId"
          [options]="categorias()"
          optionLabel="descripcion"
          optionValue="categoriaId"
          placeholder="Seleccione categoría"
          styleClass="w-full"
          [fluid]="true"
          [showClear]="true"
          [loading]="categoriasCargando()"
          [ngClass]="{ 'ng-invalid': invalid('categoriaId') }"
          [appendTo]="'body'"
        />
        @if (invalid('categoriaId')) {
          <small class="err">Seleccione una categoría</small>
        }
      </div>

      <div class="campo">
        <label for="cstounit">Costo unitario</label>
        <p-inputnumber size="small"
          id="cstounit"
          formControlName="cstounit"
          mode="currency"
          currency="HNL"
          [locale]="'es-HN'"
          [minFractionDigits]="2"
          [maxFractionDigits]="2"
          [useGrouping]="true"
          [inputStyle]="{ 'width': '100%' }"
        />
      </div>

      <div class="campo">
        <label for="cstoprom">Costo promedio</label>
        <p-inputnumber size="small"
          id="cstoprom"
          formControlName="cstoprom"
          mode="currency"
          currency="HNL"
          [locale]="'es-HN'"
          [minFractionDigits]="2"
          [maxFractionDigits]="2"
          [useGrouping]="true"
          [inputStyle]="{ 'width': '100%' }"
        />
      </div>

      <div class="campo">
        <label for="precioventa">Precio de venta</label>
        <p-inputnumber size="small"
          id="precioventa"
          formControlName="precioventa"
          mode="currency"
          currency="HNL"
          [locale]="'es-HN'"
          [minFractionDigits]="2"
          [maxFractionDigits]="2"
          [useGrouping]="true"
          [inputStyle]="{ 'width': '100%' }"
        />
      </div>

      <div class="campo">
        <label for="puntoretorno">Punto de retorno</label>
        <p-inputnumber size="small"
          id="puntoretorno"
          formControlName="puntoretorno"
          mode="currency"
          currency="HNL"
          [locale]="'es-HN'"
          [minFractionDigits]="2"
          [maxFractionDigits]="2"
          [useGrouping]="true"
          [inputStyle]="{ 'width': '100%' }"
        />
      </div>

      @if (esEdicion()) {
        <div class="campo">
          <label>Estado <span class="req">*</span></label>
          <p-select size="small"
            [options]="snOptions"
            formControlName="sn_activo"
            optionLabel="label"
            optionValue="value"
            placeholder="Estado"
            styleClass="w-full"
            [appendTo]="'body'"
          />
        </div>
      }

      <div class="acciones-form">
        <p-button
          type="button"
          label="Cancelar"
          icon="pi pi-times"
          severity="secondary"
          size="small"
          rounded
          (onClick)="volver()"
        />
        <p-button type="submit" label="Guardar" icon="pi pi-check" rounded size="small" [loading]="guardando()" />
      </div>
    </form>
  }
</section>

<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">{{ config?.titulo }}</h1>
      <p class="page-subtitle">{{ config?.subtitulo }}</p>
    </div>
    <div>
      @if (!config.soloLectura) {
        <p-button label="Nuevo" icon="pi pi-plus" [size]="'small'" [rounded]="true" (onClick)="nuevo()" />
      }
    </div>
  </header>

  <div class="filtros card">
    <div class="campo">
      <label>Buscar</label>
      <input
        pInputText
        type="text"
        placeholder="Buscar..."
        [ngModel]="q()"
        (ngModelChange)="q.set($event)"
        (keyup.enter)="buscar()"
        [pSize]="'small'"
      />
    </div>
    <div class="campo acciones">
      <p-button label="Buscar" icon="pi pi-search" [size]="'small'" [rounded]="true" (onClick)="buscar()" />
      <p-button
        label="Limpiar"
        icon="pi pi-times"
        severity="secondary"
        variant="text"
        [size]="'small'"
        [rounded]="true"
        (onClick)="limpiarFiltros()"
      />
    </div>
  </div>

  <p-table
    [value]="filtered()"
    [loading]="cargando()"
    [dataKey]="config.idKeyMae"
    [rowHover]="true"
    [paginator]="true"
    [rows]="20"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}"
    size="small"
    styleClass="p-datatable-sm lista-maestro"
  >
    <ng-template #header>
      <tr>
        <th>Registro</th>
        @for (c of columnasLista(); track c) {
          <th>{{ c }}</th>
        }
      </tr>
    </ng-template>

    <ng-template #body let-item>
      <tr class="fila-click" (click)="!config.soloLectura && editar(item[config.idKeyMae])">
        <td class="c-titulo">{{ config.tituloLista(item) }}</td>
        @for (f of config.filasLista(item); track f.label) {
          <td>{{ f.value }}</td>
        }
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="100" class="text-center p-3">No hay registros.</td>
      </tr>
    </ng-template>
  </p-table>
</section>

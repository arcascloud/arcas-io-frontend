<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">Pedidos</h1>
      <p class="page-subtitle">Pedidos de clientes</p>
    </div>
    <div>
      <p-button label="Nuevo" icon="pi pi-plus" [size]="'small'" [rounded]="true" (onClick)="nuevo()" />
    </div>
  </header>

  <div class="card filtros-card">
    <div class="filtros-row">
      <div class="campo">
        <label class="campo-label">Fecha desde</label>
        <p-datepicker
          size="small"
          [ngModel]="fechaDesde()"
          (ngModelChange)="fechaDesde.set($event)"
          dateFormat="dd/mm/yy"
          [showIcon]="true"
          [appendTo]="'body'"
          placeholder="Desde"
          styleClass="w-full"
          [readonlyInput]="true"
        />
      </div>
      <div class="campo">
        <label class="campo-label">Fecha hasta</label>
        <p-datepicker
          size="small"
          [ngModel]="fechaHasta()"
          (ngModelChange)="fechaHasta.set($event)"
          dateFormat="dd/mm/yy"
          [showIcon]="true"
          [appendTo]="'body'"
          placeholder="Hasta"
          styleClass="w-full"
          [readonlyInput]="true"
        />
      </div>
      <div class="campo campo-busqueda">
        <label class="campo-label">Buscar</label>
        <span class="p-input-icon-left">
          <input pInputText type="text" [pSize]="'small'"
            placeholder="Nombre del cliente o # pedido..."
            [ngModel]="q()" (ngModelChange)="q.set($event)" (keyup.enter)="buscar()"
            class="busqueda-input" />
        </span>
      </div>
      <div class="filtros-acciones">
        <p-button label="Buscar" icon="pi pi-search" severity="primary" [size]="'small'" [rounded]="true" (onClick)="buscar()" />
        <p-button label="Limpiar" icon="pi pi-times" severity="secondary" text [size]="'small'" [rounded]="true" (onClick)="limpiar()" />
      </div>
    </div>
  </div>

  <div class="card tabla-card">
    <p-table [value]="filtered()" [loading]="cargando()"
    showGridlines
    selectionMode="single"
    [tableStyle]="{ 'min-width': '40rem' }"
     [paginator]="true" [rows]="20"
      [rowsPerPageOptions]="[10, 20, 50]" [showCurrentPageReport]="true"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} pedidos"
      styleClass="pedidos-table">
      <ng-template #header>
        <tr>
          <th style="text-align:center; width:5rem"># Pedido</th>
          <th style="text-align:center; width:5rem">Fecha</th>
          <th style="width:14rem">Cliente</th>
          <th style="text-align:center; width:5rem">Teléfono</th>
          <th style="text-align:center; width:5rem">Envío Gratis</th>
          <th style="text-align:center; width:5rem">Facturado</th>
          <th style="text-align:center; width:8rem">Total</th>
          <th style="text-align: center; width:8rem">Acciones</th>
        </tr>
      </ng-template>
      <ng-template #body let-p>
        <tr (click)="editar(p.pospedmaeId)" class="fila-click"
          pTooltip="Haga click para ver el detalle del pedido" tooltipPosition="top">
          <td style="text-align:center">
            <span class="nro-factura">{{ nroPedido(p.pospedmaeId) }}</span>
          </td>
          <td style="text-align:center">
            {{ fechaCorta(p.fecharegistro) }}</td>
          <td>
            <span class="ml-3 cliente-nombre">{{ p.nombrecliente || 'Sin cliente' }}</span>
          </td>
          <td style="text-align:right;">
            <span class="mr-3">{{ p.nrotelefono || '-' }}</span>
          </td>
          <td style="text-align:center">
            <p-tag [value]="getEnvioLabel(p.sn_enviogratis)" [severity]="getEnvioSeverity(p.sn_enviogratis)" styleClass="tag-sm" />
          </td>
          <td style="text-align:center">
            <p-tag [value]="getFacturadoLabel(p.sn_facturado)" [severity]="getFacturadoSeverity(p.sn_facturado)" styleClass="tag-sm" />
          </td>
          <td class="text-right">
            <span class="mr-3">{{ moneda(p.total) }}</span>
          </td>
          <td class="acciones-cell">
            <div class="acciones-row">
              <p-button icon="pi pi-pencil" severity="info" text rounded [size]="'small'"
                (onClick)="editar(p.pospedmaeId); $event.stopPropagation()" pTooltip="Editar" tooltipPosition="top" />
              <p-button icon="pi pi-print" severity="secondary" text rounded [size]="'small'"
                [loading]="imprimiendo() === p.pospedmaeId" [disabled]="imprimiendo() != null && imprimiendo() !== p.pospedmaeId"
                (onClick)="imprimir(p); $event.stopPropagation()" pTooltip="Imprimir detalle" tooltipPosition="top" />
            </div>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="8" class="empty-state">
            <div class="empty-content">
              <i class="pi pi-shopping-cart"></i>
              <p>No hay pedidos registrados</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</section>

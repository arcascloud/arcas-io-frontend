<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">Scripts por Usuario</h1>
      <p class="page-subtitle">Asignación de scripts personalizados por usuario</p>
    </div>
    <p-button label="Asignar script" icon="pi pi-plus" rounded size="small" (onClick)="nuevo()" />
  </header>

  <div class="filtros card">
    <div class="campo">
      <label>Buscar</label>
      <input
        pInputText
        type="text"
        placeholder="Usuario o script..."
        [ngModel]="q()"
        (ngModelChange)="q.set($event)"
        (keyup.enter)="buscar()"
      />
    </div>
    <div class="campo acciones">
      <p-button label="Buscar" icon="pi pi-search" size="small" (onClick)="buscar()" />
      <p-button
        label="Limpiar"
        icon="pi pi-times"
        severity="secondary"
        text
        size="small"
        (onClick)="limpiarFiltros()"
      />
    </div>
  </div>

  <p-dataview
    [value]="filtered()"
    [loading]="cargando()"
    dataKey="tusuarioscriptsId"
    [paginator]="true"
    [rows]="20"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}"
  >
    <ng-template #list let-items>
      <div class="dv-cards">
        @for (s of items; track s.tusuarioscriptsId) {
          <div class="dv-card">
            <div class="dv-top">
              <span class="dv-title">{{ s.script }}</span>
            </div>

            <div class="dv-body">
              <div class="dv-row">
                <span class="dv-label">Usuario</span>
                <span class="dv-value">{{ s.usuario }}</span>
              </div>
            </div>

            <div class="dv-actions" (click)="$event.stopPropagation()">
              <p-button
                icon="pi pi-trash"
                pTooltip="Eliminar"
                (onClick)="eliminar(s, $event)"
                severity="danger"
                text
                size="small"
                rounded
              />
            </div>
          </div>
        }
      </div>
    </ng-template>

    <ng-template #emptymessage>
      <div class="text-center p-3">No hay scripts que coincidan con los filtros.</div>
    </ng-template>
  </p-dataview>
</section>

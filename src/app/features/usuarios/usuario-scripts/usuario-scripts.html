<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">Scripts por Usuario</h1>
      <p class="page-subtitle">Asignación de scripts personalizados por usuario</p>
    </div>
    <p-button label="Asignar script" icon="pi pi-plus" rounded size="small" (onClick)="nuevo()" />
  </header>

  <div class="filtros card">
    <div class="campo">
      <label>Buscar</label>
      <input
        pInputText
        type="text"
        placeholder="Usuario o script..."
        [ngModel]="q()"
        (ngModelChange)="q.set($event)"
        (keyup.enter)="buscar()"
      />
    </div>
    <div class="campo acciones">
      <p-button label="Buscar" icon="pi pi-search" size="small" (onClick)="buscar()" />
      <p-button
        label="Limpiar"
        icon="pi pi-times"
        severity="secondary"
        text
        size="small"
        (onClick)="limpiarFiltros()"
      />
    </div>
  </div>

  <p-table
    [value]="filtered()"
    [loading]="cargando()"
    dataKey="tusuarioscriptsId"
    [paginator]="true"
    [rows]="20"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}"
    size="small"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Usuario</th>
        <th>Script</th>
        <th style="width:6rem"></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-s>
      <tr>
        <td class="font-bold">{{ s.usuario }}</td>
        <td>{{ s.script }}</td>
        <td>
          <p-button icon="pi pi-trash" pTooltip="Eliminar" (onClick)="eliminar(s, $event)"
            severity="danger" text size="small" rounded />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="3" class="text-center p-3">No hay scripts que coincidan con los filtros.</td></tr>
    </ng-template>
  </p-table>
</section>

<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">{{ titulo() }}</h1>
      <p class="page-subtitle">Asignar un script personalizado a un usuario</p>
    </div>
    <p-button
      label="Volver"
      icon="pi pi-arrow-left"
      severity="secondary"
      text
      [size]="'small'"
      rounded
      (onClick)="cancel()"
    />
  </header>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="card form-grid">
    <div class="campo">
      <label for="usuario">Usuario <span class="req">*</span></label>
      <p-select
size="small"         id="usuario"
        formControlName="usuario"
        [options]="usuarios()"
        optionLabel="nombre"
        optionValue="usuario"
        [filter]="true"
        filterBy="nombre,usuario"
        filterPlaceholder="Buscar usuario..."
        placeholder="Seleccione usuario"
        appendTo="body"
      />
      @if (invalid('usuario')) {
        <small class="err">Debe seleccionar un usuario</small>
      }
    </div>

    <div class="campo">
      <label for="script">Script <span class="req">*</span></label>
      <input
        pInputText
        id="script"
        formControlName="script"
        placeholder="Nombre del script a ejecutar"
      />
      @if (invalid('script')) {
        <small class="err">El script es obligatorio</small>
      }
    </div>

    <div class="acciones-form">
<p-button
          type="button"
          label="Cancelar"
          icon="pi pi-times"
          severity="secondary"
          [size]="'small'"
          rounded
          (onClick)="cancel()"
        />
      <p-button type="submit" label="Guardar" icon="pi pi-check" rounded [size]="'small'" [loading]="guardando()" />
    </div>
  </form>
</section>

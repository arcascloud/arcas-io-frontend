<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">Usuarios</h1>
      <p class="page-subtitle">Administración de usuarios del sistema</p>
    </div>
    <p-button label="Nuevo usuario" icon="pi pi-plus" rounded size="small" (onClick)="nuevo()" />
  </header>

  <div class="filtros card">
    <div class="campo">
      <label>Buscar</label>
      <input
        pInputText
        type="text"
        placeholder="Usuario, nombre o email..."
        [ngModel]="q()"
        (ngModelChange)="q.set($event)"
        (keyup.enter)="buscar()"
      />
    </div>
    <div class="campo">
      <label>Estado</label>
      <p-select
size="small"         [options]="estadoOptions"
        optionLabel="label"
        optionValue="value"
        [ngModel]="estadoFiltro()"
        (onChange)="estadoFiltro.set($event.value); buscar()"
        placeholder="Todos"
      />
    </div>
    <div class="campo acciones">
      <p-button label="Buscar" icon="pi pi-search" size="small" (onClick)="buscar()" />
      <p-button
        label="Limpiar"
        icon="pi pi-times"
        severity="secondary"
        text
        size="small"
        (onClick)="limpiarFiltros()"
      />
    </div>
  </div>

  <p-table
    [value]="filtered()"
    [loading]="cargando()"
    dataKey="usuario"
    [paginator]="true"
    [rows]="20"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}"
    size="small"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width:6rem">Usuario</th>
        <th>Nombre</th>
        <th>Email</th>
        <th style="width:6rem">Estado</th>
        <th style="width:4rem"></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-u>
      <tr (click)="editar(u.usuario)">
        <td class="font-bold">{{ u.usuario }}</td>
        <td>{{ u.nombre || '-' }}</td>
        <td>{{ u.email || '-' }}</td>
        <td><p-tag [value]="activoLbl(u.sn_activo)" [severity]="activoSev(u.sn_activo)" /></td>
        <td>
          <p-button icon="pi pi-pencil" pTooltip="Editar" (onClick)="editar(u.usuario, $event)"
            severity="warn" text size="small" rounded />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="5" class="text-center p-3">No hay usuarios que coincidan con los filtros.</td></tr>
    </ng-template>
  </p-table>
</section>

<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">{{ titulo() }}</h1>
      <p class="page-subtitle">Registro de módulo del sistema</p>
    </div>
    <p-button
      label="Volver"
      icon="pi pi-arrow-left"
      severity="secondary"
      text
      [size]="'small'"
      rounded
      (onClick)="volver()"
    />
  </header>

  @if (cargando()) {
    <div class="card">Cargando datos...</div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="guardar()" class="card form-grid">
      <div class="campo">
        <label for="descripcion">Descripción <span class="req">*</span></label>
        <input
          pInputText
          id="descripcion"
          formControlName="descripcion"
          placeholder="Nombre del módulo"
        />
        @if (invalid('descripcion')) {
          <small class="err">La descripción es obligatoria</small>
        }
      </div>

      <div class="campo">
        <label for="abreviatura">Abreviatura</label>
        <input
          pInputText
          id="abreviatura"
          formControlName="abreviatura"
          maxlength="20"
          placeholder="Ej: INV, FAC, CXC"
        />
        <small class="hint">Máximo 20 caracteres</small>
      </div>

      @if (esEdicion()) {
        <div class="campo">
          <label>Estado <span class="req">*</span></label>
          <p-selectbutton size="small"
            [options]="snOptions"
            formControlName="sn_activo"
            optionLabel="label"
            optionValue="value"
          />
        </div>
      }

      <div class="acciones-form">
        <p-button
          type="button"
          label="Cancelar"
          icon="pi pi-times"
          severity="secondary"
          [size]="'small'"
          rounded
          (onClick)="volver()"
        />
        <p-button type="submit" label="Guardar" icon="pi pi-check" rounded [size]="'small'" [loading]="guardando()" />
      </div>
    </form>
  }
</section>

<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">{{ titulo() }}</h1>
      <p class="page-subtitle">Asignación de módulos y submenús por usuario</p>
    </div>
    <p-button
      label="Volver"
      icon="pi pi-arrow-left"
      severity="secondary"
      text
      size="small"
      rounded
      (onClick)="volver()"
    />
  </header>

  @if (cargando()) {
    <div class="card">Cargando datos...</div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="guardar()" class="card form-grid">
      <div class="campo">
        <label for="usuario">Usuario <span class="req">*</span></label>
        <p-select
size="small"           id="usuario"
          formControlName="usuario"
          [options]="usuarios()"
          optionLabel="nombre"
          optionValue="usuario"
          [filter]="true"
          filterBy="nombre,usuario"
          filterPlaceholder="Buscar usuario..."
          placeholder="Seleccione usuario"
          appendTo="body"
          [disabled]="esEdicion()"
        />
        @if (invalid('usuario')) {
          <small class="err">Debe seleccionar un usuario</small>
        }
      </div>

      <div class="campo">
        <label for="moduloId">Módulo <span class="req">*</span></label>
        <p-select
size="small"           id="moduloId"
          formControlName="moduloId"
          [options]="modulos()"
          optionLabel="descripcion"
          optionValue="moduloId"
          placeholder="Seleccione módulo"
          appendTo="body"
          [disabled]="esEdicion()"
        />
        @if (invalid('moduloId')) {
          <small class="err">Debe seleccionar un módulo</small>
        }
      </div>

      <div class="campo">
        <label>Datos</label>
        <p-selectbutton size="small"
          [options]="snOptions"
          formControlName="submnudatos"
          optionLabel="label"
          optionValue="value"
        />
      </div>

      <div class="campo">
        <label>Procesos</label>
        <p-selectbutton size="small"
          [options]="snOptions"
          formControlName="submnurocesos"
          optionLabel="label"
          optionValue="value"
        />
      </div>

      <div class="campo">
        <label>Reportes</label>
        <p-selectbutton size="small"
          [options]="snOptions"
          formControlName="submnueportes"
          optionLabel="label"
          optionValue="value"
        />
      </div>

      <div class="acciones-form">
        <p-button
          type="button"
          label="Cancelar"
          icon="pi pi-times"
          severity="secondary"
          size="small"
          rounded
          (onClick)="volver()"
        />
        <p-button type="submit" label="Guardar" icon="pi pi-check" rounded size="small" [loading]="guardando()" />
      </div>
    </form>
  }
</section>

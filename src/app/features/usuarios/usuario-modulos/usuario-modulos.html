<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">Módulos por Usuario</h1>
      <p class="page-subtitle">Asignación de módulos y submenús por usuario</p>
    </div>
    <p-button label="Asignar módulo" icon="pi pi-plus" rounded size="small" (onClick)="nuevo()" />
  </header>

  <div class="filtros card">
    <div class="campo">
      <label>Buscar</label>
      <input
        pInputText
        type="text"
        placeholder="Usuario, nombre o módulo..."
        [ngModel]="q()"
        (ngModelChange)="q.set($event)"
        (keyup.enter)="buscar()"
      />
    </div>
    <div class="campo acciones">
      <p-button label="Buscar" icon="pi pi-search" size="small" (onClick)="buscar()" />
      <p-button
        label="Limpiar"
        icon="pi pi-times"
        severity="secondary"
        text
        size="small"
        (onClick)="limpiarFiltros()"
      />
    </div>
  </div>

  <p-treeTable
    [value]="nodos()"
    [loading]="cargando()"
    dataKey="key"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}"
    styleClass="tt-modulos"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Usuario</th>
        <th>Nombre</th>
        <th>Items</th>
        <th style="width: 10rem">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-rowNode let-node="node" let-rowData="rowData">
      @if (node.data.tipo === 'usuario') {
        <tr class="fila-usuario">
          <td>
            <p-treeTableToggler [rowNode]="rowNode" />
            <span class="usuario-login">{{ node.data.usuario }}</span>
          </td>
          <td>{{ node.data.nombre }}</td>
          <td>
            <p-tag [value]="(node.data.totalModulos || 0) + ' módulos'" severity="info" />
          </td>
          <td>
            <p-button
              icon="pi pi-plus"
              label="Asignar"
              pTooltip="Asignar módulo a este usuario"
              tooltipPosition="top"
              severity="success"
              text
              size="small"
              rounded
              (onClick)="nuevo(rowData.usuario); $event.stopPropagation()"
            />
          </td>
        </tr>
      } @else {
        <tr class="fila-modulo">
          <td class="celda-modulo">
            <div class="modulo-fila">
              <span class="modulo-nombre">{{ rowData.moduloNombre }}</span>
              <span class="permitir-label">Permitir</span>
              <p-toggleswitch
                [ngModel]="rowData.sn_activo === 'S'"
                (ngModelChange)="toggleActivo(rowData, $event)"
                inputId="perm-{{ rowData.id }}"
                ariaLabel="Permitir módulo"
              />
            </div>
          </td>
          <td class="celda-vacia"></td>
          <td class="celda-vacia"></td>
          <td class="celda-vacia"></td>
        </tr>
      }
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="text-center p-3">No hay asignaciones que coincidan con los filtros.</td>
      </tr>
    </ng-template>
  </p-treeTable>
</section>

<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">{{ titulo() }}</h1>
      <p class="page-subtitle">Asignación de roles por usuario (tusuarios_rol)</p>
    </div>
    <p-button
      label="Volver"
      icon="pi pi-arrow-left"
      severity="secondary"
      text
      size="small"
      rounded
      (onClick)="volver()"
    />
  </header>

  @if (cargando()) {
    <div class="card">Cargando datos...</div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="guardar()" class="card form-grid">
      <div class="campo">
        <label for="usuarioId">Usuario <span class="req">*</span></label>
        <p-select
          size="small"
          id="usuarioId"
          formControlName="usuarioId"
          [options]="usuarios()"
          optionLabel="nombre"
          optionValue="usuarioId"
          [filter]="true"
          filterBy="nombre,usuario"
          filterPlaceholder="Buscar usuario..."
          placeholder="Seleccione usuario"
          styleClass="w-full"
          [appendTo]="'body'"
          [disabled]="esEdicion()"
        />
        @if (invalid('usuarioId')) {
          <small class="err">Debe seleccionar un usuario</small>
        }
      </div>

      <div class="campo">
        <label for="rol">Rol <span class="req">*</span></label>
        <p-select
          size="small"
          id="rol"
          formControlName="rol"
          [options]="tiposRol()"
          optionLabel="rol"
          optionValue="rol"
          [filter]="true"
          filterBy="rol"
          filterPlaceholder="Buscar rol..."
          placeholder="Seleccione rol"
          styleClass="w-full"
          [appendTo]="'body'"
        />
        @if (invalid('rol')) {
          <small class="err">Debe seleccionar un rol</small>
        }
        <small class="hint">Roles disponibles definidos en el catálogo (ttipo_rol)</small>
      </div>

      <div class="acciones-form">
        <p-button
          type="button"
          label="Cancelar"
          icon="pi pi-times"
          severity="secondary"
          size="small"
          rounded
          (onClick)="volver()"
        />
        <p-button
          type="submit"
          label="Guardar"
          icon="pi pi-check"
          rounded
          size="small"
          severity="success"
          variant="text"
          [raised]="true"
          [loading]="guardando()"
        />
      </div>
    </form>
  }
</section>

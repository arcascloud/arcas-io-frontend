<section class="page">
  <header class="page-header">
    <div>
      <h1 class="page-title">Menu Items por Usuario</h1>
      <p class="page-subtitle">Asignación de items de menú por usuario y módulo</p>
    </div>
    <p-button label="Asignar menu item" icon="pi pi-plus" rounded size="small" (onClick)="nuevo()" />
  </header>

  <div class="filtros card">
    <div class="campo">
      <label>Buscar</label>
      <input
        pInputText
        type="text"
        placeholder="Usuario, item, ruta o módulo..."
        [ngModel]="q()"
        (ngModelChange)="q.set($event)"
        (keyup.enter)="buscar()"
      />
    </div>
    <div class="campo acciones">
      <p-button label="Buscar" icon="pi pi-search" size="small" (onClick)="buscar()" />
      <p-button
        label="Limpiar"
        icon="pi pi-times"
        severity="secondary"
        text
        size="small"
        (onClick)="limpiarFiltros()"
      />
    </div>
  </div>

  <p-table
    [value]="filtered()"
    [loading]="cargando()"
    dataKey="tusuariomnuitemsId"
    [paginator]="true"
    [rows]="20"
    [rowsPerPageOptions]="[10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}"
    size="small"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Usuario</th>
        <th>Modulo</th>
        <th>Label</th>
        <th>Nombre</th>
        <th>Ruta</th>
        <th style="width:4rem">Nivel</th>
        <th style="width:5rem">Estado</th>
        <th style="width:6rem"></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-i>
      <tr>
        <td class="font-bold">{{ i.usuario }}</td>
        <td>{{ getModuloName(i.moduloId) }}</td>
        <td>{{ i.labelItem }}</td>
        <td>{{ i.nameItem }}</td>
        <td>{{ i.routerLink || '-' }}</td>
        <td class="text-center">{{ i.levelId }}</td>
        <td><p-tag [value]="activoLbl(i.sn_activo)" [severity]="activoSev(i.sn_activo)" /></td>
        <td>
          <p-button icon="pi pi-pencil" pTooltip="Editar" (onClick)="editar(i.tusuariomnuitemsId, $event)"
            severity="warn" text size="small" rounded class="mr-1" />
          <p-button icon="pi pi-trash" pTooltip="Eliminar" (onClick)="eliminar(i, $event)"
            severity="danger" text size="small" rounded />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr><td colspan="8" class="text-center p-3">No hay items que coincidan con los filtros.</td></tr>
    </ng-template>
  </p-table>
</section>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#92400e"/>
      <stop offset="100%" style="stop-color:#78350f"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>
  <!-- Horn of plenty (cornucopia) -->
  <path d="M25 85 C25 85 30 45 55 35 C70 29 80 32 80 32 L75 38 C75 38 68 36 56 41 C42 47 38 75 38 85 Z" fill="url(#hornGrad)" stroke="#78350f" stroke-width="1.5"/>
  <path d="M80 32 C82 31 90 33 88 40 C86 46 75 38 75 38 Z" fill="#a16207"/>
  <!-- Coins spilling out -->
  <circle cx="52" cy="28" r="7" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1"/>
  <text x="52" y="31" text-anchor="middle" font-size="8" font-weight="bold" fill="#78350f">$</text>
  <circle cx="68" cy="22" r="6" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1"/>
  <text x="68" y="25" text-anchor="middle" font-size="7" font-weight="bold" fill="#78350f">$</text>
  <circle cx="42" cy="22" r="5.5" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1"/>
  <text x="42" y="25" text-anchor="middle" font-size="7" font-weight="bold" fill="#78350f">$</text>
  <circle cx="60" cy="16" r="5" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1"/>
  <text x="60" y="19" text-anchor="middle" font-size="6" font-weight="bold" fill="#78350f">$</text>
  <circle cx="78" cy="28" r="4.5" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1"/>
  <!-- Leaves/fruits -->
  <ellipse cx="35" cy="35" rx="4" ry="6" fill="#16a34a" transform="rotate(-30 35 35)" opacity="0.8"/>
  <ellipse cx="30" cy="42" rx="3.5" ry="5" fill="#22c55e" transform="rotate(-45 30 42)" opacity="0.7"/>
  <circle cx="82" cy="20" r="3" fill="#dc2626" opacity="0.8"/>
  <circle cx="46" cy="15" r="2.5" fill="#f97316" opacity="0.8"/>
</svg>
